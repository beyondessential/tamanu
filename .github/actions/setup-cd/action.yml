name: CD Setup
description: Set up Pulumi, Tailscale, and K8S
inputs:
  with-infra:
    description: Check out the infra repo and install Pulumi, needed to deploy or undeploy
    default: 'false'
  infra-ref:
    description: Ref to checkout in infra repo
    default: main
  tailscale-oauth-client-id:
    description: Tailscale OAuth client ID for OIDC authentication
    required: true
  tailscale-tags:
    description: Tailscale tags for the connection (must match OIDC trust configuration)
    required: true
  tailscale-k8s-operator-hostname:
    description: Hostname of the Tailscale Kubernetes operator to configure kubeconfig
    required: true
runs:
  using: composite
  steps:
    - if: inputs.with-infra == 'true'
      name: Checkout infra
      uses: actions/checkout@v6
      with:
        repository: beyondessential/infra
        path: infra
        ref: ${{ inputs.infra-ref }}
        persist-credentials: false
    - name: Remove infra/.git so pulumi doesn't get confused
      if: inputs.with-infra == 'true'
      shell: bash
      run: rm -rf infra/.git

    - name: Install Node.js for infra
      if: inputs.with-infra == 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: infra/.node-version
        cache: npm

    - name: Install Node.js for us
      if: inputs.with-infra != 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: npm

    - name: Prepare pulumi
      if: inputs.with-infra == 'true'
      shell: bash
      working-directory: infra/pulumi
      run: npm ci

    - name: Pre-install pulumi
      if: inputs.with-infra == 'true'
      uses: pulumi/actions@v7

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        audience: api.tailscale.com/${{ inputs.tailscale-oauth-client-id }}
        tags: '${{ inputs.tailscale-tags }}'

    - name: Configure kubeconfig
      shell: bash
      run: |
        sudo tailscale set --operator=$USER
        tailscale configure kubeconfig ${{ inputs.tailscale-k8s-operator-hostname }}

    - name: Test kubernetes cluster for readiness
      shell: bash
      run: kubectl get namespace/tamanu-system

    # Log the identity the API server actually sees, plus the perms that matter
    # for seed-snapshot deploys. Cheap insurance: a future 403 on this runner
    # can be diagnosed in one click without grepping the tailscale operator logs.
    - name: Log k8s identity
      shell: bash
      run: |
        kubectl auth whoami -o yaml || true
        kubectl auth can-i list volumesnapshots -n tamanu-seed || true
        kubectl auth can-i create volumesnapshots -n '*' || true
