name: Pack a Windows bundle as a base-less OCI image
description: >
  Tar a staged Windows bundle as a single OCI layer and push it to ghcr.io as an
  ordinary, but base-less, windows/amd64 OCI image: the layer carries only the
  workload's own files and the image config declares how to run them, with no OS
  base baked in. The Seedling Windows runtime completes the image for execution
  by stacking its own OS base beneath these layers — see
  beyondessential/seedling docs/spec/runtime-windows-containers.md,
  wcr[artifact.format] and wcr[compose.chain].

  The calling job stages the bundle at <layer-dir>/Files/..., which is the
  Windows container layer format: Files/ is the container's C:\ drive, so
  Files/app/... lands at C:\app\... and paths in the config are real absolute
  paths (no root-directory indirection).
inputs:
  package:
    required: true
    description: central | facility | frontend | patient-portal
  package-path:
    required: true
    description: workspace path of the package, e.g. central-server | web
  kind:
    required: true
    description: server | frontend (shapes the image config)
  layer-dir:
    required: false
    default: layer
    description: directory holding the staged layer root (must contain Files/)
  version:
    required: true
    description: app version string
  sha:
    required: true
    description: commit sha driving the image tags
  github-token:
    required: true
    description: token for ghcr.io login
runs:
  using: composite
  steps:
    # Windows' bundled bsdtar rather than Git Bash's tar: libarchive handles long
    # paths (which node_modules produces plenty of) and writes the pax records a
    # Windows layer wants — MSWINDOWS.fileattr, MSWINDOWS.rawsd, and
    # LIBARCHIVE.creationtime, the same set Microsoft's own base-image layers
    # carry. --dereference so nothing is left pointing outside the layer.
    - name: Tar the layer
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $layerDir = '${{ inputs.layer-dir }}'
        if (-not (Test-Path -PathType Container (Join-Path $layerDir 'Files'))) {
          throw "'$layerDir' does not contain a Files/ directory"
        }
        & "$env:SystemRoot\System32\tar.exe" --format pax --dereference -cf layer.tar -C $layerDir Files
        if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
        Write-Host "layer.tar is $([math]::Round((Get-Item layer.tar).Length / 1MB, 1)) MiB"

    - name: Install oras
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ver = '1.2.0'
        Invoke-WebRequest -Uri "https://github.com/oras-project/oras/releases/download/v$ver/oras_${ver}_windows_amd64.zip" -OutFile oras.zip
        Expand-Archive -Path oras.zip -DestinationPath oras-bin -Force
        "$PWD\oras-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & "$PWD\oras-bin\oras.exe" version

    - name: Push image
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PKG: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        SHA: ${{ inputs.sha }}
        KIND: ${{ inputs.kind }}
        PKG_PATH: ${{ inputs.package-path }}
        MANIFEST_TYPE: application/vnd.oci.image.manifest.v1+json
        CONFIG_TYPE: application/vnd.oci.image.config.v1+json
        LAYER_TYPE: application/vnd.oci.image.layer.v1.tar+gzip
      run: |
        set -euxo pipefail
        image="ghcr.io/beyondessential/tamanu-$PKG"
        tag="sha-$SHA.windows-amd64"

        # diff_id is the digest of the *uncompressed* layer, so hash before gzip.
        diff_id="sha256:$(sha256sum layer.tar | cut -d' ' -f1)"
        gzip -n -6 layer.tar

        # The PATH a Windows base image sets, prefixed with the bundle's own
        # runtime dir: the config's Env replaces the environment wholesale, and
        # since the base is stacked in later there is nothing to inherit it from.
        system_path='C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0'

        # Mirrors the linux image config (see /Dockerfile), at Windows paths:
        # servers run docker-entrypoint.sh's effective `node --import tsx app serve`
        # from the package directory, frontends run caddy over the built dist.
        # Labels carry the process profile the Windows runtime reads
        # (wcr[artifact.profile]): node and caddy both shut down cleanly on a
        # console control event, and neither takes a reload event.
        if [ "$KIND" = 'frontend' ]; then
          runcfg="$(jq -n --arg path "C:\\caddy;$system_path" '{
            WorkingDir: "C:\\app",
            Env: ["NODE_ENV=production", ("PATH=" + $path)],
            Entrypoint: ["caddy"],
            Cmd: ["run","--config","C:/caddy/Caddyfile","--adapter","caddyfile"],
            ExposedPorts: {"3000/tcp": {}},
            Labels: {"au.bes.seedling.stop-method": "ctrl_break"}
          }')"
        else
          runcfg="$(jq -n --arg pp "$PKG_PATH" --arg path "C:\\app\\runtime;$system_path" '{
            WorkingDir: ("C:\\app\\packages\\" + $pp),
            Env: [
              "NODE_ENV=production",
              "PORT=3000",
              ("NODE_CONFIG_DIR=C:\\config;C:\\app\\packages\\" + $pp + "\\config"),
              ("PATH=" + $path)
            ],
            Entrypoint: ["node","--import","tsx","app"],
            Cmd: ["serve"],
            ExposedPorts: {"3000/tcp": {}},
            Labels: {"au.bes.seedling.stop-method": "ctrl_break"}
          }')"
        fi

        # A standard OCI image config. No os.version: the artifact carries no OS
        # base, so it is not tied to one Windows build — the runtime stacks a base
        # matching its host beneath it.
        jq -n \
          --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg diff_id "$diff_id" \
          --arg version "$VERSION" \
          --argjson config "$runcfg" \
          '{created: $created, architecture: "amd64", os: "windows",
            config: $config,
            rootfs: {type: "layers", diff_ids: [$diff_id]},
            history: [{created: $created,
                       created_by: ("tamanu " + $version + " windows bundle"),
                       comment: "base-less: completed with the runtime OS base"}]}' \
          > imageconfig.json
        cat imageconfig.json

        # no xtrace around the token
        set +x
        echo "$GH_TOKEN" | oras login ghcr.io -u '${{ github.actor }}' --password-stdin
        set -x

        # Assemble the image manifest by hand rather than with `oras push`, which
        # decorates layers with artifact annotations: this is a plain OCI image
        # manifest, so its descriptors should carry nothing but the media types.
        config_desc="$(oras blob push --descriptor "$image" imageconfig.json)"
        layer_desc="$(oras blob push --descriptor "$image" layer.tar.gz)"
        jq -n \
          --argjson config "$config_desc" \
          --argjson layer "$layer_desc" \
          --arg manifest_type "$MANIFEST_TYPE" \
          --arg config_type "$CONFIG_TYPE" \
          --arg layer_type "$LAYER_TYPE" \
          --arg pkg "$PKG" \
          --arg version "$VERSION" \
          '{schemaVersion: 2,
            mediaType: $manifest_type,
            config: {mediaType: $config_type, digest: $config.digest, size: $config.size},
            layers: [{mediaType: $layer_type, digest: $layer.digest, size: $layer.size}],
            annotations: {
              "org.opencontainers.image.title": ("Tamanu " + $pkg + " (Windows)"),
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.source": "https://github.com/beyondessential/tamanu/",
              "org.opencontainers.image.vendor": "BES International",
              "org.opencontainers.image.licenses": "GPL-3.0-or-later",
              "au.bes.tamanu.package": $pkg,
              "au.bes.tamanu.os": "windows",
              "au.bes.tamanu.arch": "amd64"
            }}' \
          | tee manifest.json \
          | oras manifest push --media-type "$MANIFEST_TYPE" "$image:$tag" -
