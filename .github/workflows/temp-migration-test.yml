name: Temp Migration Test

# Temporary: runs the release cut's migration rehearsal against this branch so the
# seed top-up can be exercised before 2.65 is cut. Delete before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  seed-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/seed-image.yml
    secrets: inherit
    with:
      ref: ${{ github.head_ref }}
      version: 2.65.0

  migration-test:
    needs: seed-image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/migration-test.yml
    secrets: inherit
    with:
      version: 2.65.0
      image: ${{ needs.seed-image.outputs.image }}
      git_sha: ${{ needs.seed-image.outputs.git_sha }}
