name: Review Hero
on:
  pull_request:
    types: [opened, reopened, edited]

jobs:
  review:
    # `id-token: write` lets the review request the identity token that
    # authenticates the findings post, and is granted here rather than on the
    # whole workflow so no other job can request one.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: beyondessential/review-hero/.github/workflows/review.yml@v1
    with:
      # Each round's findings go to Workhorse as data. A post Workhorse refuses
      # or never answers leaves both comments below to be posted as usual.
      findings-url: https://workhorse.bes.au/api/review-hero/rounds
      per-issue-comments: standalone
      summary-comment: standalone
    secrets: inherit
