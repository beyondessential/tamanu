name: CD Package Android


permissions:
  contents: write # to update the release notes
  id-token: write # OIDC token for AWS
  pull-requests: write # to post apk link comment

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      branding:
        type: string
        required: false
        default: tamanu
      server:
        type: string
        required: false
      architectures:
        type: string
        required: false
        description: Comma-separated Gradle reactNativeArchitectures override (e.g. arm64-v8a)
    secrets:
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true

      # only required for release
      META_CERT:
        required: false
      META_KEY:
        required: false

  workflow_dispatch:
    inputs:
      branding:
        type: choice
        required: false
        default: tamanu
        options:
          - tamanu
      server:
        description: Central server override
        type: string
        required: false
      architectures:
        description: Comma-separated ABIs (e.g. arm64-v8a,x86_64 for BlueStacks/emulators)
        type: string
        required: false
        default: arm64-v8a,x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: packages/mobile/android

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Update branding app title
        if: ${{ inputs.branding != 'tamanu' }}
        env:
          appnames: '{}'
        working-directory: packages/mobile/android/app/src/main/res/values
        run: sed -i "s/Tamanu Mobile/${{fromjson(env.appnames)[inputs.branding]}}/g" strings.xml

      - name: Set branding mipmap app icons
        if: ${{ inputs.branding != 'tamanu' }}
        working-directory: packages/mobile/android/app/src/main/res
        run: |
          if [ -d ${{inputs.branding}} ]; then
            rm -rf mipmap-*
            mv ${{inputs.branding}}/* .
          else
            echo "Warning: No folder called '${{inputs.branding}}' found."
          fi

      - name: Set server overrides
        if: ${{ inputs.server }}
        working-directory: packages/mobile
        run: |
          cat <<EOF > serverOverrides.json
          {
            "centralServers": [{"label": "Central Server", "value": "https://${{inputs.server}}" }]
          }
          EOF

      - name: Make branding available to app
        working-directory: packages/mobile/android
        run: |
          echo "BRANDING=${{ inputs.branding }}" > .env

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm install --include-workspace-root --workspace=@tamanu/mobile

      # The New Architecture compiles each native module's C++ via CMake, which
      # dominates build time. ccache persists the compiled objects across runs so
      # only changed sources recompile. CMake reads the *_COMPILER_LAUNCHER vars
      # from the environment at configure time.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-${{ inputs.branding }}
          max-size: 2G

      - name: Build release
        working-directory: packages/mobile/android
        env:
          ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: |
          ARCH_ARGS=""
          if [ -n "${{ inputs.architectures }}" ]; then
            ARCH_ARGS="-PreactNativeArchitectures=${{ inputs.architectures }}"
          fi
          ./gradlew app:assembleRelease $ARCH_ARGS

      # Apps targeting API 35+ must support 16 KB memory page sizes on 64-bit devices,
      # enforced by Google Play from 1 Feb 2027. NDK r27 aligns shared libraries to 4 KB
      # unless a module opts in (see ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES in
      # packages/mobile/android/build.gradle), so assert it here: a native module that
      # slips through should fail this build, not a Play upload months later.
      # This checks ELF LOAD segment alignment, which is what the loader uses and what
      # was actually at risk. zipalign -P below checks a different thing — where the .so
      # sits inside the APK — and would pass even with 4 KB-aligned segments.
      # https://developer.android.com/guide/practices/page-sizes
      - name: Assert 16 KB alignment of 64-bit native libraries
        working-directory: packages/mobile/android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          workdir="$(mktemp -d)"
          unzip -q "$apk" 'lib/*' -d "$workdir"

          checked=0
          failed=0
          while IFS= read -r so; do
            abi="$(basename "$(dirname "$so")")"
            case "$abi" in
              arm64-v8a | x86_64) ;;
              *) continue ;;  # Play only enforces this for 64-bit ABIs
            esac
            checked=$((checked + 1))
            # A library can have several LOAD segments; the smallest alignment governs.
            min="$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' \
              | while read -r a; do printf '%d\n' "$a"; done | sort -n | head -1)"
            if [ "$min" -lt 16384 ]; then
              echo "::error::$abi/$(basename "$so") is ${min}-byte aligned, need >= 16384"
              failed=$((failed + 1))
            else
              echo "ok  $abi/$(basename "$so") ($min)"
            fi
          done < <(find "$workdir/lib" -type f -name '*.so' | sort)

          if [ "$checked" -eq 0 ]; then
            echo "::error::No 64-bit native libraries found in $apk — the check did not run"
            exit 1
          fi
          echo "Checked $checked 64-bit libraries, $failed misaligned."
          [ "$failed" -eq 0 ]

          # Complementary: verifies the .so entries are page-aligned within the zip so
          # they can be mapped directly from the APK. AGP handles this, so it is a guard
          # against packaging regressions rather than the requirement above.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" > /dev/null

      - name: Upload final build
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{github.run_number}}
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Post comment with release link
        continue-on-error: true
        if: github.event_name == 'pull_request' || github.event_name == 'issues'
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.artifact-upload.outputs.artifact-url }}
          BUILD_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const { ARTIFACT_URL, BUILD_NUMBER } = process.env;
            const { repo, owner } = context.repo;
            const { number: issue_number } = context.issue;
            if (!issue_number) return;
            const params = {
              issue_number,
              owner,
              repo,
            };
            const headerContent = "**Android builds 📱**";
            const latestText = " **Latest**";
            const comments = await github.rest.issues.listComments(params);
            const existingComment = comments.data.find((comment) =>
              comment.body.includes(headerContent)
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                ...params,
                comment_id: existingComment.id,
                body: existingComment.body
                  .replace(latestText, "")
                  .replace(
                    headerContent,
                    `${headerContent}\n- **${BUILD_NUMBER}:** [Download Android APK](${ARTIFACT_URL})${latestText}`
                  ),
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body: `${headerContent}\n- **${BUILD_NUMBER}:** [Download Android APK](${ARTIFACT_URL})${latestText}`,
              });
            }

      - name: Set S3 destination
        id: destination
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            if (context.ref == 'refs/heads/main') {
              return `main/${(new Date).toISOString().replaceAll(':','-').split('.')[0]}.${context.sha.slice(0, 10)}`;
            } else if (context.ref.startsWith('refs/tags/v')) {
              return context.ref.replace('refs/tags/v', '');
            } else if (context.ref.startsWith('refs/heads/release/')) {
              return `${context.ref.replace('refs/tags/', '')}-rc`;
            } else {
              return 'nowhere';
            }

      - name: Configure AWS Credentials (upload)
        if: steps.destination.outputs.result != 'nowhere'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::143295493206:role/gha-desktop-s3
          role-session-name: GHA@Tamanu=AndroidPackage

      - name: Push to S3
        if: steps.destination.outputs.result != 'nowhere'
        env:
          target: ${{ steps.destination.outputs.result }}
        run: |
          aws s3 cp --no-progress \
            packages/mobile/android/app/build/outputs/apk/release/app-release.apk \
            s3://bes-tamanu-release-clients/$target/android/${{inputs.branding}}/app-release.apk

      - if: steps.destination.outputs.result != 'nowhere' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          body: |
            ## Mobile app 📱
            - [Android](https://clients.ops.tamanu.io/${{ steps.destination.outputs.result }}/android/${{inputs.branding}}/app-release.apk)

      - name: Post to meta
        if: steps.destination.outputs.result != 'nowhere' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: ./.github/actions/meta-api
        with:
          url: ${{ vars.META_URL }}
          crt: ${{ secrets.META_CERT }}
          key: ${{ secrets.META_KEY }}
          api: /artifacts/${{ steps.destination.outputs.result }}/mobile/android
          arg: --data-binary 'https://clients.ops.tamanu.io/${{ steps.destination.outputs.result }}/android/${{inputs.branding}}/app-release.apk'
