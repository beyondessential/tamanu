name: Seed Snapshot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (e.g. release/2.1.0)'
        type: string
        required: true
      version:
        description: 'Semver version (e.g. 2.1.0)'
        type: string
        required: true
      image:
        description: 'Seed image ref (e.g. ghcr.io/beyondessential/tamanu-seed:2.1.0)'
        type: string
        required: true
      git_sha:
        description: 'Git SHA to tag the snapshot with (defaults to HEAD)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      version:
        type: string
        required: true
      image:
        type: string
        required: true
      git_sha:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  SEED_NAMESPACE: tamanu-seed

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    name: Seed snapshot for ${{ inputs.version }}
    # Must exceed the watch step's own budget: a job-level timeout is a hard failure that
    # continue-on-error can't absorb, so it would fail the release cut over a watchdog.
    timeout-minutes: 30
    steps:
      - name: Validate version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$INPUT_VERSION' — expected X.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v6

      # Best-effort: a degraded snapshotter (Tailscale/k8s unreachable, or the
      # pgsnap operator down) must not fail the release-cut run that calls this
      # workflow. continue-on-error isn't valid on the caller's reusable-workflow
      # job, so the infra-touching steps tolerate failure here instead. A bad
      # input still fails loudly via "Validate version format" above.
      - uses: ./.github/actions/setup-cd
        continue-on-error: true
        with:
          tailscale-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          tailscale-tags: ${{ vars.TS_TAGS }}
          tailscale-k8s-operator-hostname: ${{ vars.TS_K8S_OPERATOR_HOSTNAME }}

      - name: Derive job name
        id: names
        run: |
          SAFE_VERSION="${{ inputs.version }}"
          SAFE_VERSION="${SAFE_VERSION//./-}"
          JOB_NAME="seed-migrate-${SAFE_VERSION}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

      # We submit the Job suspended and the pgsnap operator owns the rest of the
      # lifecycle: provisioning the PVC + DB secret, unsuspending, snapshotting
      # on completion, GC.
      - name: Create seed Job
        continue-on-error: true
        env:
          JOB_NAME: ${{ steps.names.outputs.job_name }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          GIT_SHA: ${{ inputs.git_sha || github.sha }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${SEED_NAMESPACE}
            labels:
              pgsnap.bes.au/create: "true"
            annotations:
              # PVC + postgres pod sizing for the operator-managed snapshot DB.
              # The migrate container's own resources are set in spec.containers below.
              pgsnap.bes.au/size: "5Gi"
              pgsnap.bes.au/cpu: "2"
              pgsnap.bes.au/memory: "4Gi"
              pgsnap.bes.au/for-version: "${VERSION}"
              pgsnap.bes.au/source-branch: "${BRANCH}"
              pgsnap.bes.au/git-sha: "${GIT_SHA}"
          spec:
            suspend: true
            backoffLimit: 0
            activeDeadlineSeconds: 7200
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                tolerations:
                  - key: bes.node.purpose
                    operator: Equal
                    value: spot-workload
                    effect: NoSchedule
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: bes.node.purpose
                              operator: In
                              values: [workload]
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    envFrom:
                      - secretRef:
                          name: pgsnap-${JOB_NAME}
                    resources:
                      requests:
                        cpu: 250m
                        memory: 1Gi
                        ephemeral-storage: 512Mi
                      limits:
                        cpu: "1"
                        memory: 2Gi
                        ephemeral-storage: 2Gi
          EOF

      # Seeding runs for far longer than a release cut should wait, so we don't wait for
      # the snapshot itself. We do wait for the container to start and then stay up for
      # SETTLE_SECONDS, because the failures worth catching here all land within seconds
      # of starting: a bad image ref, a missing DB_* key (the seed runs under `bash -u`),
      # an unreadable config. Left unwatched, `backoffLimit: 0` means such a pod sits
      # until activeDeadlineSeconds two hours later with nothing reporting it. The cut
      # itself is already done either way, hence continue-on-error.
      - name: Wait for the seed to start
        continue-on-error: true
        # Not the default `bash -e`: this step polls for a pod that does not exist yet, so
        # a non-zero kubectl is expected and errexit would abort the watch before it starts.
        shell: bash --noprofile --norc -uo pipefail {0}
        env:
          JOB_NAME: ${{ steps.names.outputs.job_name }}
          VERSION: ${{ inputs.version }}
          # The Job stays suspended until the operator has a CNPG cluster accepting
          # connections, which measured ~10 minutes on the 2.61.0 snapshot.
          START_TIMEOUT_SECONDS: '1200'
          SETTLE_SECONDS: '60'
        run: |
          follow="kubectl logs -f -n $SEED_NAMESPACE job/$JOB_NAME"

          if ! kubectl get job "$JOB_NAME" -n "$SEED_NAMESPACE" >/dev/null 2>&1; then
            echo "::warning::Seed job $JOB_NAME was not created; no snapshot for $VERSION."
            exit 1
          fi

          fail() {
            [[ -n "${1:-}" ]] && kubectl logs "$1" -n "$SEED_NAMESPACE" --tail=50
            [[ -n "${1:-}" ]] && kubectl describe pod "$1" -n "$SEED_NAMESPACE"
            echo "::error::$2"
            exit 1
          }

          settle_deadline=
          list_errors=0
          hard_deadline=$((SECONDS + START_TIMEOUT_SECONDS + SETTLE_SECONDS))
          while (( SECONDS < hard_deadline )); do
            if [[ "$(kubectl get job "$JOB_NAME" -n "$SEED_NAMESPACE" \
                  -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')" == "True" ]]; then
              kubectl describe job "$JOB_NAME" -n "$SEED_NAMESPACE"
              fail "" "Seed job $JOB_NAME failed; no snapshot for $VERSION."
            fi

            # `items[*]` rather than `items[0]`: the latter errors while the Job is still
            # suspended and no pod exists. A query that cannot run at all must not read as
            # "no pod yet", or the watch sits here for the whole timeout saying nothing.
            if ! pod=$(kubectl get pods -n "$SEED_NAMESPACE" \
              -l "batch.kubernetes.io/job-name=$JOB_NAME" \
              -o jsonpath='{.items[*].metadata.name}'); then
              list_errors=$((list_errors + 1))
              if (( list_errors >= 3 )); then
                fail "" "Cannot list pods in $SEED_NAMESPACE; no snapshot for $VERSION."
              fi
              sleep 10
              continue
            fi
            list_errors=0
            pod=${pod%% *}

            status=
            if [[ -n "$pod" ]]; then
              status=$(kubectl get pod "$pod" -n "$SEED_NAMESPACE" -o json 2>/dev/null | jq -r '
                .status.containerStatuses[0].state as $s
                | [($s.running.startedAt // "-"),
                   ($s.terminated.exitCode // "-" | tostring),
                   ($s.waiting.reason // "-")] | @tsv')
            fi

            if [[ -n "$status" ]]; then
              read -r started exited waiting <<<"$status"

              # Terminated first: a container that already exited has no running state.
              if [[ "$exited" != - ]]; then
                if [[ "$exited" == 0 ]]; then
                  echo "::notice::Seed job $JOB_NAME completed; the operator snapshots it from here."
                  exit 0
                fi
                fail "$pod" "Seed pod $pod exited with code $exited; no snapshot for $VERSION."
              fi

              case "$waiting" in
                ErrImagePull | ImagePullBackOff | InvalidImageName | CrashLoopBackOff | \
                CreateContainerError | CreateContainerConfigError)
                  fail "$pod" "Seed pod $pod cannot start ($waiting); no snapshot for $VERSION."
                  ;;
              esac

              if [[ "$started" != - ]]; then
                if [[ -z "$settle_deadline" ]]; then
                  echo "Seed container started at $started; watching ${SETTLE_SECONDS}s for an early exit."
                  settle_deadline=$((SECONDS + SETTLE_SECONDS))
                elif (( SECONDS >= settle_deadline )); then
                  echo "::notice::Seed job $JOB_NAME is running. Follow it with: $follow"
                  exit 0
                fi
              fi
            fi

            sleep 10
          done

          if [[ -n "$settle_deadline" ]]; then
            echo "::notice::Seed job $JOB_NAME is running. Follow it with: $follow"
            exit 0
          fi

          kubectl describe job "$JOB_NAME" -n "$SEED_NAMESPACE"
          echo "::warning::Seed job $JOB_NAME had not started in time. Check it with: $follow"
          exit 1

