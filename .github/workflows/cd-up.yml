name: CD Up

on:
  workflow_call:
    inputs:
      deploy-name:
        type: string
        required: true
      options:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      control:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true
      TAMANU_OPS_SSH:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # for Tailscale OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: ${{ inputs.deploy-name }}
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup-cd
        with:
          ops-ssh-key: ${{ secrets.TAMANU_OPS_SSH }}
          ops-ref: ${{ fromJson(inputs.options).opsref }}
          tailscale-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          tailscale-tags: ${{ vars.TS_TAGS }}
          tailscale-k8s-operator-hostname: ${{ vars.TS_K8S_OPERATOR_HOSTNAME }}

      - name: Create or check namespace
        run: |
          NS_NAME="tamanu-${{ inputs.deploy-name }}"

          # Check if subnamespace anchor exists
          if kubectl -n tamanu-super get subnamespaceanchor "$NS_NAME" 2>/dev/null; then
            echo "Namespace exists, checking it's matched to this branch"
            kubectl -n "$NS_NAME" \
              get configmap auto-deploy -o json \
              | tee -a /dev/stderr \
              | jq -e '.data | [.repo == "${{ github.repository }}", .ref == "${{ inputs.ref }}"] | all'
          else
            # Create SubnamespaceAnchor - HNC will create the namespace
            kubectl apply -f - <<EOF
          apiVersion: hnc.x-k8s.io/v1alpha2
          kind: SubnamespaceAnchor
          metadata:
            name: $NS_NAME
            namespace: tamanu-super
          EOF

            # Wait for namespace to be created by HNC
            kubectl wait --for=condition=Ready subnamespaceanchor/"$NS_NAME" \
              -n tamanu-super --timeout=30s || true

            # Create tracking configmap
            kubectl -n "$NS_NAME" \
              create configmap auto-deploy \
              --from-literal=repo=${{ github.repository }} \
              --from-literal=ref=${{ inputs.ref }}
          fi

          kubectl -n "$NS_NAME" \
            patch configmap auto-deploy \
            -p '{"data":{"control":"${{ inputs.control }}"}}'

          kubectl -n "$NS_NAME" \
            patch configmap auto-deploy \
            -p '{"data":{"imageTag":"${{ inputs.image-tag }}"}}'

      - name: Generate pulumi config
        id: config
        uses: actions/github-script@v9
        env:
          K8S_CORE: ${{ vars.K8S_CORE }}
        with:
          script: |
            const fs = require('fs');
            const cwd = '${{ github.workspace }}';
            const pkg = JSON.parse(fs.readFileSync(`${cwd}/package.json`, 'utf8'));
            const appVersion = pkg.version || null;
            const { configMap } = await import(`${cwd}/packages/scripts/src/ghaCdHelpers.mjs`);
            const config = configMap('${{ inputs.deploy-name }}', '${{ inputs.image-tag }}', ${{ inputs.options }}, { appVersion });
            core.setOutput('pulumi', config);

      - name: Get full stack name
        id: stack
        working-directory: ops/pulumi/stacks/${{ fromJson(inputs.options).opsstack }}
        run: |
          project=$(ruby -e 'require "yaml"; puts YAML.load(open "Pulumi.yaml")["name"]')
          echo "stackname=bes/$project/${{ inputs.deploy-name }}" >> $GITHUB_OUTPUT

      - name: Up!
        id: up
        uses: pulumi/actions@v7
        with:
          work-dir: ops/pulumi/stacks/${{ fromJson(inputs.options).opsstack }}
          command: up
          stack-name: ${{ steps.stack.outputs.stackname }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-pr: false
          upsert: true
          config-map: ${{ steps.config.outputs.pulumi }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Comment Pulumi report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PULUMI_OUTPUT: ${{ steps.up.outputs.output }}
        with:
          script: |
            if (!context.issue.number) return;

            const fullOutput = process.env.PULUMI_OUTPUT ?? '';
            const marker = '<!-- pulumi-up-report:${{ inputs.deploy-name }} -->';

            const liveLinkMatch = fullOutput.match(/^View Live:\s*(\S+)/m);
            // "Outputs:" header, then indented "key: value" lines until a blank
            // line or a line back at column 0 (see pulumi/pulumi printOutputs()).
            const outputsMatch = fullOutput.match(/^Outputs:\n((?:[ \t]+\S.*\n?)+)/m);

            let body;
            if (liveLinkMatch || outputsMatch) {
              const parts = [];
              if (liveLinkMatch) parts.push(`**View Live:** ${liveLinkMatch[1]}`);
              if (outputsMatch) parts.push(`**Outputs:**\n${outputsMatch[1].trimEnd()}`);
              body = parts.join('\n\n');
            } else {
              // Fallback if the expected markers aren't found: head + tail of the raw output.
              const HEAD_TAIL_LENGTH = 500;
              body = fullOutput.length <= HEAD_TAIL_LENGTH * 2
                ? fullOutput
                : `${fullOutput.slice(0, HEAD_TAIL_LENGTH)}\n\n...\n\n${fullOutput.slice(-HEAD_TAIL_LENGTH)}`;
            }
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
