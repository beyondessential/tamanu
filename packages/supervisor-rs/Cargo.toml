[package]
name = "tamanu-supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "json"] }
bytes = "1.12.2"
governor = "0.10.4"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "compression-gzip", "compression-zstd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
