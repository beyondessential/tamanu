// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 31
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
                if (defaultConfig.minSdkVersion.apiLevel < 24) {
                    defaultConfig {
                        minSdkVersion 24
                    }
                }

                // Google Play requires apps targeting API 35+ to support 16 KB memory page
                // sizes on 64-bit devices (enforced from 1 Feb 2027). NDK r27 still aligns
                // shared libraries to 4 KB unless this is opted into; r28 makes it the
                // default. Most native modules (React Native, Reanimated, Screens, Gesture
                // Handler, Worklets) already pass this themselves, but some don't — notably
                // react-native-quick-sqlite — so apply it to every subproject rather than
                // relying on each one. Harmless to set on modules with no native build, and
                // harmless to repeat for those that already opt in.
                // https://developer.android.com/guide/practices/page-sizes
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                        }
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
