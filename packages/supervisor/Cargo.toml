[package]
name = "tamanu-supervisor"
version = "0.0.0"
publish = false
description = "Tamanu's supervisor: the front door of a Tamanu server"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2"] }
bytes = "1.12.2"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-auto", "server-graceful", "http1", "http2"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "compression-gzip", "compression-zstd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
