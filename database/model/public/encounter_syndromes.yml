version: 2
sources:
  - name: tamanu
    schema: public
    description: "{{ doc('generic__schema') }}"
    tables:
      - name: encounter_syndromes
        description: "{{ doc('table__encounter_syndromes') }}"
        config:
          tags:
            - clinical
          meta:
            triggers:
              - delete_encounter_syndromes_from_sync_lookup
              - notify_encounter_syndromes_changed
              - record_encounter_syndromes_changelog
              - set_encounter_syndromes_updated_at
              - set_encounter_syndromes_updated_at_sync_tick
        columns:
          - name: id
            data_type: text
            description: "{{ doc('generic__id') }} in encounter_syndromes."
            data_tests:
              - unique
              - not_null
            config:
              meta:
                masking: text
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in encounter_syndromes."
            data_tests:
              - not_null
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in encounter_syndromes."
            data_tests:
              - not_null
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in encounter_syndromes."
          - name: updated_at_sync_tick
            data_type: bigint
            description: "{{ doc('generic__updated_at_sync_tick') }} in
              encounter_syndromes."
            data_tests:
              - not_null
          - name: encounter_id
            data_type: character varying(255)
            description: "{{ doc('encounter_syndromes__encounter_id') }}"
            data_tests:
              - not_null
              - unique
              - relationships:
                  arguments:
                    to: source('tamanu', 'encounters')
                    field: id
