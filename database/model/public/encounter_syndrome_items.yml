version: 2
sources:
  - name: tamanu
    schema: public
    description: "{{ doc('generic__schema') }}"
    tables:
      - name: encounter_syndrome_items
        description: "{{ doc('table__encounter_syndrome_items') }}"
        config:
          tags:
            - clinical
          meta:
            triggers:
              - delete_encounter_syndrome_items_from_sync_lookup
              - notify_encounter_syndrome_items_changed
              - record_encounter_syndrome_items_changelog
              - set_encounter_syndrome_items_updated_at
              - set_encounter_syndrome_items_updated_at_sync_tick
        columns:
          - name: id
            data_type: text
            description: "{{ doc('generic__id') }} in encounter_syndrome_items."
            data_tests:
              - unique
              - not_null
            config:
              meta:
                masking: text
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in encounter_syndrome_items."
            data_tests:
              - not_null
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in encounter_syndrome_items."
            data_tests:
              - not_null
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in encounter_syndrome_items."
          - name: updated_at_sync_tick
            data_type: bigint
            description: "{{ doc('generic__updated_at_sync_tick') }} in
              encounter_syndrome_items."
            data_tests:
              - not_null
          - name: encounter_syndrome_id
            data_type: text
            description: "{{ doc('encounter_syndrome_items__encounter_syndrome_id') }}"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tamanu', 'encounter_syndromes')
                    field: id
          - name: syndrome_id
            data_type: character varying(255)
            description: "{{ doc('encounter_syndrome_items__syndrome_id') }}"
            data_tests:
              - not_null
              - dbt_utils.relationships_where:
                  arguments:
                    to: source('tamanu', 'reference_data')
                    field: id
                    to_condition: type = 'syndromicSurveillanceSymptom'
          - name: checked
            data_type: boolean
            description: "{{ doc('encounter_syndrome_items__checked') }}"
            data_tests:
              - not_null
