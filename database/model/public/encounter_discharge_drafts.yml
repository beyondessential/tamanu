version: 2
sources:
  - name: tamanu
    schema: public
    description: "{{ doc('generic__schema') }}"
    tables:
      - name: encounter_discharge_drafts
        description: "{{ doc('table__encounter_discharge_drafts') }}"
        config:
          tags:
            - clinical
          meta:
            triggers:
              - record_encounter_discharge_drafts_changelog
        columns:
          - name: id
            data_type: uuid
            description: "{{ doc('generic__id') }} in encounter_discharge_drafts."
            data_tests:
              - unique
              - not_null
          - name: encounter_id
            data_type: character varying(255)
            description: "{{ doc('encounter_discharge_drafts__encounter_id') }}"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tamanu', 'encounters')
                    field: id
          - name: user_id
            data_type: character varying(255)
            description: "{{ doc('encounter_discharge_drafts__user_id') }}"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tamanu', 'users')
                    field: id
          - name: end_date
            data_type: character(19)
            description: "{{ doc('encounter_discharge_drafts__end_date') }}"
          - name: discharger_id
            data_type: character varying(255)
            description: "{{ doc('encounter_discharge_drafts__discharger_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('tamanu', 'users')
                    field: id
          - name: disposition_id
            data_type: character varying(255)
            description: "{{ doc('encounter_discharge_drafts__disposition_id') }}"
            data_tests:
              - dbt_utils.relationships_where:
                  arguments:
                    to: source('tamanu', 'reference_data')
                    field: id
                    to_condition: type = 'dischargeDisposition'
          - name: note
            data_type: text
            description: "{{ doc('encounter_discharge_drafts__note') }}"
            config:
              meta:
                masking: text
          - name: seeded_note_ids
            data_type: array
            description: "{{ doc('encounter_discharge_drafts__seeded_note_ids') }}"
            data_tests:
              - not_null
          - name: ordering_clinician_id
            data_type: character varying(255)
            description: "{{ doc('encounter_discharge_drafts__ordering_clinician_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('tamanu', 'users')
                    field: id
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in encounter_discharge_drafts."
            data_tests:
              - not_null
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in encounter_discharge_drafts."
            data_tests:
              - not_null
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in encounter_discharge_drafts."
