version: 2
sources:
  - name: tamanu
    schema: public
    description: "{{ doc('generic__schema') }}"
    tables:
      - name: blobs
        description: "{{ doc('table__blobs') }}"
        config:
          tags:
            - system
          meta:
            triggers: []
        columns:
          - name: id
            data_type: character varying(255)
            description: "{{ doc('generic__id') }} in blobs."
            data_tests:
              - unique
              - not_null
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in blobs."
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in blobs."
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in blobs."
          - name: hash
            data_type: text
            description: "{{ doc('blobs__hash') }}"
            data_tests:
              - not_null
          - name: size
            data_type: bigint
            description: "{{ doc('blobs__size') }}"
            data_tests:
              - not_null
          - name: integrity_state
            data_type: text
            description: "{{ doc('blobs__integrity_state') }}"
            data_tests:
              - not_null
          - name: tier
            data_type: text
            description: "{{ doc('blobs__tier') }}"
            data_tests:
              - not_null
          - name: last_accessed_at
            data_type: timestamp with time zone
            description: "{{ doc('blobs__last_accessed_at') }}"
            data_tests:
              - not_null
          - name: last_scrubbed_at
            data_type: timestamp with time zone
            description: "{{ doc('blobs__last_scrubbed_at') }}"
          - name: eligible_since_tick
            data_type: bigint
            description: "{{ doc('blobs__eligible_since_tick') }}"
          - name: has_parity
            data_type: boolean
            description: "{{ doc('blobs__has_parity') }}"
            data_tests:
              - not_null
          - name: correction_count
            data_type: integer
            description: "{{ doc('blobs__correction_count') }}"
            data_tests:
              - not_null
          - name: last_corrected_at
            data_type: timestamp with time zone
            description: "{{ doc('blobs__last_corrected_at') }}"
          - name: scan_verdict
            data_type: text
            description: "{{ doc('blobs__scan_verdict') }}"
          - name: scanned_at
            data_type: timestamp with time zone
            description: "{{ doc('blobs__scanned_at') }}"
          - name: scanner_version
            data_type: text
            description: "{{ doc('blobs__scanner_version') }}"
          - name: signature_version
            data_type: text
            description: "{{ doc('blobs__signature_version') }}"
