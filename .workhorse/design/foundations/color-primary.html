<!doctype html>
<!-- @dsCard group="Colors" name="Primary Color" subtitle="Tamanu Blue + Dark Blue" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto'}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{height:84px;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;line-height:15px}
.sw .n{font-weight:500}
.sw .h{opacity:.9;font-family:ui-monospace,Menlo,monospace;font-size:10px}
.light{color:#2E2F33}
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#326699"><div class="n">Tamanu Blue 100</div><div class="h">#326699</div></div>
  <div class="sw light" style="background:#C2D2E1"><div class="n">Tamanu Blue 30</div><div class="h">#C2D2E1</div></div>
  <div class="sw light" style="background:#EBF0F5;border:1px solid #DEDEDE"><div class="n">Tamanu Blue 10</div><div class="h">#EBF0F5</div></div>
  <div class="sw" style="background:#2F4358"><div class="n">Dark Blue</div><div class="h">#2F4358</div></div>
</div>
</body></html>
