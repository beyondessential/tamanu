<!doctype html>
<!-- @dsCard group="Colors" name="Status Colors" subtitle="Success · Alert · Warning" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto'}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.sw{height:60px;border-radius:3px;display:flex;flex-direction:column;justify-content:center;padding:10px;font-size:11px;line-height:15px}
.sw .n{font-weight:500}
.sw .h{opacity:.85;font-family:ui-monospace,Menlo,monospace;font-size:10px}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#47CA80;color:#fff"><div class="n">Success 100</div><div class="h">#47CA80</div></div>
  <div class="sw" style="background:#DAF4E6;color:#1F7A44"><div class="n">Success 20</div><div class="h">#DAF4E6</div></div>
  <div class="sw" style="background:#EDFAF3;color:#1F7A44;border:1px solid #DEDEDE"><div class="n">Success 10</div><div class="h">#EDFAF3</div></div>
</div>
<div class="row">
  <div class="sw" style="background:#F76853;color:#fff"><div class="n">Alert 100</div><div class="h">#F76853</div></div>
  <div class="sw" style="background:#FDE1DD;color:#B53A2A"><div class="n">Alert 20</div><div class="h">#FDE1DD</div></div>
  <div class="sw" style="background:#FFF0EE;color:#B53A2A;border:1px solid #DEDEDE"><div class="n">Alert 10</div><div class="h">#FFF0EE</div></div>
</div>
<div class="row">
  <div class="sw" style="background:#FFCC24;color:#444"><div class="n">Warning 100</div><div class="h">#FFCC24</div></div>
  <div class="sw" style="background:#FFF5D3;color:#8A6A1C"><div class="n">Warning 20</div><div class="h">#FFF5D3</div></div>
  <div class="sw" style="background:#FFFAEA;color:#8A6A1C;border:1px solid #DEDEDE"><div class="n">Warning 10</div><div class="h">#FFFAEA</div></div>
</div>
</body></html>
