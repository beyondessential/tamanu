<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Flush · Raised · Float · Inset" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#F3F5F7;font-family:'Roboto';font-size:11px;color:#666}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border-radius:3px;height:80px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end}
.card .n{color:#2E2F33;font-weight:500;font-size:12px}
.card .h{font-size:10px;color:#888;font-family:ui-monospace,Menlo,monospace}
.flush{background:#fff;box-shadow:0 1px 1px 0 rgba(0,0,0,0.05),0 2px 4px 0 rgba(0,0,0,0.1)}
.raised{box-shadow:0 2px 2px 0 rgba(0,0,0,0.1),0 4px 16px 0 rgba(0,0,0,0.1)}
.float{box-shadow:0 8px 32px 0 rgba(0,0,0,0.15)}
.inset{background:#fff;box-shadow:inset 0 2px 4px 0 rgba(0,0,0,0.1),inset 0 1px 1px 0 rgba(0,0,0,0.05)}
</style></head>
<body>
<div class="row">
  <div class="card flush"><div class="n">Flush</div><div class="h">0 1 1 · 0 2 4</div></div>
  <div class="card raised"><div class="n">Raised</div><div class="h">0 2 2 · 0 4 16</div></div>
  <div class="card float"><div class="n">Float</div><div class="h">0 8 32 · 15%</div></div>
  <div class="card inset"><div class="n">Inset</div><div class="h">inset 0 2 4 · inset 0 1 1</div></div>
</div>
</body></html>
