<!doctype html>
<!-- @dsCard group="Brand" name="Logos" subtitle="Primary on light · reverse on dark" viewport="520x320" -->
<html><head><meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:#fff;font-family:Roboto}
.row{display:flex;flex-direction:column;gap:16px}
.card{padding:28px 32px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:32px}
.card.light{background:#fff;border:1px solid #EBEBEB}
.card.dark{background:#2E2F33}
.card img{max-height:64px;display:block}
.card.mark img{max-height:96px}
.lbl{font:500 10px/14px Roboto;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
</style></head>
<body>
<div class="row">
  <div>
    <div class="lbl">Wordmark · on light</div>
    <div class="card light"><img src="../assets/logo-tamanu-long-blue.svg" alt="Tamanu"></div>
  </div>
  <div>
    <div class="lbl">Wordmark · on dark</div>
    <div class="card dark"><img src="../assets/logo-tamanu-long-white.svg" alt="Tamanu"></div>
  </div>
  <div>
    <div class="lbl">Icon mark · on light</div>
    <div class="card mark light">
      <img src="../assets/logo-tamanu-icon-dark.svg" alt="Tamanu icon">
    </div>
  </div>
  <div>
    <div class="lbl">Icon mark · on dark</div>
    <div class="card mark dark">
      <img src="../assets/logo-tamanu-icon-light.svg" alt="Tamanu icon">
    </div>
  </div>
</div>
</body></html>
