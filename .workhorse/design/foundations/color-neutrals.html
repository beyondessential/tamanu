<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Font greys and backgrounds" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto'}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{height:84px;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:11px;line-height:15px;border:1px solid #DEDEDE}
.sw .n{font-weight:500}
.sw .h{opacity:.9;font-family:ui-monospace,Menlo,monospace;font-size:10px}
.dark{color:#fff}
</style></head>
<body>
<div class="grid">
  <div class="sw dark" style="background:#444444"><div class="n">Font 80 · Super Dark</div><div class="h">#444444</div></div>
  <div class="sw dark" style="background:#666666"><div class="n">Font 60 · Dark</div><div class="h">#666666</div></div>
  <div class="sw dark" style="background:#888888"><div class="n">Font 40 · Mid</div><div class="h">#888888</div></div>
  <div class="sw" style="background:#B8B8B8"><div class="n">Font 20 · Light</div><div class="h">#B8B8B8</div></div>
  <div class="sw" style="background:#F3F5F7"><div class="n">Background</div><div class="h">#F3F5F7</div></div>
  <div class="sw" style="background:#F9FAFB"><div class="n">Background 2</div><div class="h">#F9FAFB</div></div>
  <div class="sw" style="background:#DEDEDE"><div class="n">Box Outline</div><div class="h">#DEDEDE</div></div>
  <div class="sw" style="background:#EBEBEB"><div class="n">Default Off</div><div class="h">#EBEBEB</div></div>
</div>
</body></html>
