<!doctype html>
<!-- @dsCard group="Brand" name="Icon Set" subtitle="Lucide + MUI (curated clinical set)" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto';color:#2E2F33}
.tabs{display:flex;gap:4px;border-bottom:1px solid #DEDEDE;margin-bottom:16px}
.tab{padding:8px 16px;font:500 13px/16px Roboto;color:#888;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#326699;border-bottom-color:#326699}
.panel{display:none}
.panel.active{display:block}
.meta{font:400 11px/15px Roboto;color:#888;margin:0 0 12px}
.meta a{color:#326699;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:14px 12px}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:3px}
.ic:hover{background:#F4F9FF}
.ic svg,.ic img{width:22px;height:22px}
.ic.lucide svg{stroke:#2E2F33;fill:none}
.ic .mi{font-family:'Material Icons';font-size:22px;color:#2E2F33;line-height:22px;font-style:normal;font-weight:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.ic .mi.outlined{font-family:'Material Icons Outlined'}
.ic span.lbl{font:400 9px/12px Roboto;color:#888;text-align:center;word-break:break-word}
.loading{color:#B8B8B8;font:400 12px Roboto;padding:8px 0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
</head>
<body>

<div class="tabs">
  <button class="tab active" data-p="lucide">Lucide</button>
  <button class="tab" data-p="mui">MUI</button>
</div>

<!-- Lucide -->
<div class="panel active" id="p-lucide">
  <p class="meta">
    Loaded from <a href="https://unpkg.com/lucide-static" target="_blank">lucide-static</a> · stroke 2 · 24×24
  </p>
  <div class="grid" id="grid-lucide"><div class="loading">Loading icons…</div></div>
</div>

<!-- MUI Material Icons -->
<div class="panel" id="p-mui">
  <p class="meta">
    Loaded from <a href="https://mui.com/material-ui/material-icons/" target="_blank">MUI @mui/icons-material</a> · filled 24dp (outlined variant where specified)
  </p>
  <div class="grid" id="grid-mui"><div class="loading">Loading icons…</div></div>
</div>

<script>
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + t.dataset.p));
  });
});

// Lucide curated set (unchanged)
const lucideNames = [
  'layout-dashboard','users','calendar','stethoscope','pill','syringe',
  'clipboard-list','file-text','flask-conical','activity','heart-pulse','bed',
  'hospital','ambulance','baby','microscope','search','filter','download','printer',
  'pencil','trash-2','plus','check','x','chevron-down','chevron-right','clock',
  'settings','more-horizontal','bell','mail','phone','map-pin','alert-triangle','info'
];

// MUI set — each entry: [PascalCase component, material-icons ligature, outlined? ]
const muiIcons = [
  ['KeyboardArrowUp','keyboard_arrow_up'],
  ['KeyboardArrowDown','keyboard_arrow_down'],
  ['KeyboardArrowLeft','keyboard_arrow_left'],
  ['KeyboardArrowRight','keyboard_arrow_right'],
  ['CloudOff','cloud_off'],
  ['CloudDone','cloud_done'],
  ['OpenInNew','open_in_new'],
  ['Notes','notes'],
  ['MedicalServices','medical_services'],
  ['LocalHospital','local_hospital'],
  ['BedOutlined','bed', true],
  ['Refresh','refresh'],
  ['QrCode2','qr_code_2'],
  ['Person','person'],
  ['Fastfood','fastfood'],
  ['ImageAspectRatio','image_aspect_ratio'],
  ['SettingsAccessibility','settings_accessibility'],
  ['QuestionMark','question_mark'],
  ['FeaturedPlayList','featured_play_list'],
  ['ModeComment','mode_comment'],
  ['Shuffle','shuffle'],
  ['PriorityHigh','priority_high'],
  ['HomeWork','home_work'],
  ['VolunteerActivism','volunteer_activism'],
  ['Edit','edit'],
  ['Send','send'],
  ['AutoAwesomeMotion','auto_awesome_motion'],
  ['Timelapse','timelapse'],
  ['Biotech','biotech'],
  ['Business','business'],
  ['Tablet','tablet'],
  ['Notifications','notifications'],
  ['AssignmentLate','assignment_late'],
  ['Science','science'],
  ['MeetingRoom','meeting_room'],
  ['Print','print'],
  ['Delete','delete'],
  ['ContentPaste','content_paste'],
  ['AssignmentInd','assignment_ind'],
  ['ShoppingCart','shopping_cart'],
  ['Label','label'],
  ['DoNotDisturb','do_not_disturb'],
  ['KeyboardDoubleArrowDown','keyboard_double_arrow_down'],
  ['ShowChart','show_chart'],
  ['ReceiptLong','receipt_long'],
  ['DragIndicator','drag_indicator'],
  ['MoreVert','more_vert'],
  ['FileDownload','file_download'],
  ['Search','search'],
  ['CalendarToday','calendar_today'],
  ['AccessTime','access_time'],
  ['Sync','sync'],
  ['Article','article'],
  ['Language','language'],
  ['Workspaces','workspaces']
];

async function loadLucide() {
  const grid = document.getElementById('grid-lucide');
  grid.innerHTML = '';
  await Promise.all(lucideNames.map(async n => {
    const cell = document.createElement('div');
    cell.className = 'ic lucide';
    try {
      const res = await fetch(`https://unpkg.com/lucide-static@0.469.0/icons/${n}.svg`);
      const svg = await res.text();
      cell.innerHTML = svg + `<span class="lbl">${n}</span>`;
      cell.querySelector('svg')?.setAttribute('width','22');
      cell.querySelector('svg')?.setAttribute('height','22');
    } catch {
      cell.innerHTML = `<div style="width:22px;height:22px;border:1px dashed #DEDEDE;border-radius:3px"></div><span class="lbl">${n}</span>`;
    }
    grid.appendChild(cell);
  }));
}

function loadMui() {
  const grid = document.getElementById('grid-mui');
  grid.innerHTML = '';
  muiIcons.forEach(([pascal, ligature, outlined]) => {
    const cell = document.createElement('div');
    cell.className = 'ic mui';
    cell.innerHTML = `<span class="mi${outlined?' outlined':''}">${ligature}</span><span class="lbl">${pascal}</span>`;
    grid.appendChild(cell);
  });
}

loadLucide();
loadMui();
</script>
</body></html>
