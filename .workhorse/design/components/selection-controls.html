<!doctype html>
<!-- @dsCard group="Components" name="Selection Controls" subtitle="Checkbox · Radio · Toggle" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto';font-size:14px;color:#444}
.row{display:flex;align-items:center;gap:24px;margin-bottom:12px}
.cb{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.box{width:16px;height:16px;border:1px solid #DEDEDE;border-radius:3px;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.box.on{background:#326699;border-color:#326699;color:#fff}
.box svg{width:12px;height:12px}
.radio{width:16px;height:16px;border:1px solid #DEDEDE;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.radio.on{border-color:#326699}
.radio .dot{width:8px;height:8px;border-radius:50%;background:#326699}
.toggle{width:32px;height:18px;border-radius:999px;background:#DEDEDE;position:relative;transition:background .15s}
.toggle.on{background:#326699}
.toggle .thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .15s}
.toggle.on .thumb{left:16px}
.lbl{color:#666;font-weight:400}
</style></head>
<body>
<div class="row">
  <label class="cb"><span class="box on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12 3.4 13.4 9 19 21 7l-1.4-1.4L9 16.2z"/></svg></span><span class="lbl">Checked</span></label>
  <label class="cb"><span class="box"></span><span class="lbl">Unchecked</span></label>
  <label class="cb"><span class="box on" style="background:#326699;border-color:#326699"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 11h14v2H5z"/></svg></span><span class="lbl">Partial</span></label>
</div>
<div class="row">
  <label class="cb"><span class="radio on"><span class="dot"></span></span><span class="lbl">Yes</span></label>
  <label class="cb"><span class="radio"></span><span class="lbl">No</span></label>
  <label class="cb"><span class="radio"></span><span class="lbl">Unknown</span></label>
</div>
<div class="row">
  <label class="cb"><span class="toggle on"><span class="thumb"></span></span><span class="lbl">Sync enabled</span></label>
  <label class="cb"><span class="toggle"><span class="thumb"></span></span><span class="lbl">Offline mode</span></label>
</div>
</body></html>
