<!doctype html>
<!-- @dsCard group="Components" name="Tags" subtitle="Large 106×28 · XSmall 87×24 · 10 fills + outlined" viewport="520x520" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:'Roboto';color:#2E2F33}
h3{font:500 11px/15px Roboto;color:#888;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:460px}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* Large tag = Body Regular (14px/18px, 400) */
.tag-lg{width:106px;height:28px;border-radius:14px;font-family:'Roboto',sans-serif;font-weight:400;font-size:14px;line-height:18px;color:#2E2F33;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
/* XSmall tag = Small Regular (11px/15px, 400) */
.tag-xs{width:87px;height:24px;border-radius:12px;font-family:'Roboto',sans-serif;font-weight:400;font-size:11px;line-height:15px;color:#2E2F33;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.outlined{background:#fff;border:1px solid #326699;color:#326699}
</style></head>
<body>
<div class="cols">
  <div class="col">
    <h3>Large · 106×28</h3>
    <span class="tag-lg" style="background:#E9F5EE;color:#19934E">Outcome</span>
    <span class="tag-lg" style="background:#FAF0E6;color:#CF502C">Outcome</span>
    <span class="tag-lg" style="background:#E8F1FB;color:#1172D1">Outcome</span>
    <span class="tag-lg" style="background:#ECE6FA;color:#6B49BA">Outcome</span>
    <span class="tag-lg" style="background:#FBE7F3;color:#D51C7E">Outcome</span>
    <span class="tag-lg" style="background:#F9F5E6;color:#A88A20">Outcome</span>
    <span class="tag-lg" style="background:#FFF0EE;color:#E03E2B">Outcome</span>
    <span class="tag-lg" style="background:#F0EBE9;color:#8A6A56">Outcome</span>
    <span class="tag-lg" style="background:#EDEDED;color:#666666">Outcome</span>
    <span class="tag-lg" style="background:#E8EFF3;color:#2F4358">Outcome</span>
    <span class="tag-lg outlined">Outcome</span>
  </div>
  <div class="col">
    <h3>XSmall · 87×24</h3>
    <span class="tag-xs" style="background:#E9F5EE;color:#19934E">Outcome</span>
    <span class="tag-xs" style="background:#FAF0E6;color:#CF502C">Outcome</span>
    <span class="tag-xs" style="background:#E8F1FB;color:#1172D1">Outcome</span>
    <span class="tag-xs" style="background:#ECE6FA;color:#6B49BA">Outcome</span>
    <span class="tag-xs" style="background:#FBE7F3;color:#D51C7E">Outcome</span>
    <span class="tag-xs" style="background:#F9F5E6;color:#A88A20">Outcome</span>
    <span class="tag-xs" style="background:#FFF0EE;color:#E03E2B">Outcome</span>
    <span class="tag-xs" style="background:#F0EBE9;color:#8A6A56">Outcome</span>
    <span class="tag-xs" style="background:#EDEDED;color:#666666">Outcome</span>
    <span class="tag-xs" style="background:#E8EFF3;color:#2F4358">Outcome</span>
    <span class="tag-xs outlined">Outcome</span>
  </div>
</div>
</body></html>
