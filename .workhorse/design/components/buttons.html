<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary/Secondary + Link style + icon toggle" viewport="780x340" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:'Roboto'}
.toolbar{display:flex;gap:18px;align-items:center;margin-bottom:20px;padding:10px 14px;background:#F8F9FB;border:1px solid #DEDEDE;border-radius:5px}
.toolbar label{font-size:13px;color:#444;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toolbar input{margin:0}
.lbl{font-size:11px;color:#888;width:70px;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.hdr{font-size:10px;color:#888;text-align:center;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:70px repeat(4,max-content);gap:10px 14px;align-items:center;justify-items:start}
.grid.link-grid{grid-template-columns:70px repeat(2,max-content)}

.btn{border-radius:3px;font-family:Roboto;font-weight:500;font-size:14px;line-height:18px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box}
.btn.lg{height:44px;padding:0 20px}
.btn.md{height:40px;padding:0 20px}
.btn.sm{height:36px;padding:0 16px}
.btn.xs{height:32px;padding:0 12px;font-size:11px;line-height:15px;gap:4px}
.btn-primary{background:#326699;color:#fff}
.btn-primary:hover{background:#22486D}
.btn-secondary{background:#fff;color:#326699;border:1px solid #326699}
.btn-secondary:hover{background:#F4F9FF}
.btn-primary-disabled{background:rgba(50,102,153,.3);color:#fff;cursor:not-allowed}
.btn-secondary-disabled{background:#fff;border:1px solid rgba(50,102,153,.3);color:rgba(50,102,153,.3);cursor:not-allowed}

/* Link style */
.btn-link{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:Roboto;font-size:18px;line-height:24px}
.btn-link svg{width:20px;height:20px;flex-shrink:0}
.btn-link:hover{color:#326699;font-weight:500}
.btn-link:hover .lbl-text{text-decoration:underline;text-underline-offset:3px}
.btn-link-primary{color:#326699;font-weight:500}
.btn-link-secondary{color:#444;font-weight:400}
.btn-link-secondary .lbl-text{text-decoration:underline;text-underline-offset:3px}

/* Hide icons globally when toggle is off */
body.no-icons .btn svg,
body.no-icons .btn-link svg{display:none}
body.no-icons .btn.xs{gap:0}
body.no-icons .btn{gap:0}
body.no-icons .btn-link{gap:0}

h3{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.04em;font-weight:500;margin:26px 0 12px}
</style></head>
<body>

<div class="toolbar">
  <label><input type="checkbox" id="toggle-icons" checked> Show icons</label>
  <span style="color:#888;font-size:12px">Toggle to preview buttons with and without icons.</span>
</div>

<h3>Filled buttons</h3>
<div class="grid">
  <div></div>
  <div class="hdr">Primary</div>
  <div class="hdr">Secondary</div>
  <div class="hdr">Primary disabled</div>
  <div class="hdr">Secondary disabled</div>

  <div class="lbl">Large</div>
  <button class="btn lg btn-primary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn lg btn-secondary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn lg btn-primary-disabled"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn lg btn-secondary-disabled"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>

  <div class="lbl">Medium</div>
  <button class="btn md btn-primary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn md btn-secondary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn md btn-primary-disabled"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn md btn-secondary-disabled"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>

  <div class="lbl">Small</div>
  <button class="btn sm btn-primary"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn sm btn-secondary"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn sm btn-primary-disabled"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn sm btn-secondary-disabled"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>

  <div class="lbl">XSmall</div>
  <button class="btn xs btn-primary"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn xs btn-secondary"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn xs btn-primary-disabled"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
  <button class="btn xs btn-secondary-disabled"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Button</button>
</div>

<h3>Link style</h3>
<div class="grid link-grid">
  <div></div>
  <div class="hdr">Primary</div>
  <div class="hdr">Secondary</div>

  <div class="lbl">Link</div>
  <button class="btn-link btn-link-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M5 21h14"/></svg>
    <span class="lbl-text">Link style button</span>
  </button>
  <button class="btn-link btn-link-secondary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M5 21h14"/></svg>
    <span class="lbl-text">Link style button</span>
  </button>
</div>

<script>
  document.getElementById('toggle-icons').addEventListener('change', (e) => {
    document.body.classList.toggle('no-icons', !e.target.checked);
  });
</script>
</body></html>
