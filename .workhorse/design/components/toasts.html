<!doctype html>
<!-- @dsCard group="Components" name="Toasts" subtitle="Success · Error · Info" viewport="440x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:'Roboto'}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:4px;font:400 14px/18px Roboto;max-width:380px;margin-bottom:12px}
.toast .x{background:none;border:none;padding:0;cursor:pointer;color:inherit;opacity:.75;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px}
.toast .x:hover{opacity:1}
.t-success{background:#E9F5EE;color:#19934E}
.t-error{background:#FFF0EE;color:#E03E2B}
.t-info{background:#E8F1FB;color:#326699}
</style></head>
<body>
<div class="toast t-success">
  <span>Dolor sit amet, consectetur adipiscing</span>
  <button class="x" aria-label="Dismiss">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>
<div class="toast t-error">
  <span>Dolor sit amet, consectetur adipiscing</span>
  <button class="x" aria-label="Dismiss">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>
<div class="toast t-info">
  <span>Dolor sit amet, consectetur adipiscing</span>
  <button class="x" aria-label="Dismiss">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>
</body></html>
