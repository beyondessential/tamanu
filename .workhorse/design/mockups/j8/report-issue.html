<!-- spec: docs-hub (proposed) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tamanu docs — Report an issue</title>
<style>
  :root {
    --bg:#fff; --ink:#0a0a0a; --ink-2:#3f3f46; --ink-3:#71717a; --ink-4:#a1a1aa;
    --line:#e6e6e9; --line-soft:#f1f1f3; --fill:#fafafa;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; line-height:1.5; }
  a { color:inherit; text-decoration:none; }

  header.nav { position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .nav-inner { max-width:1120px; margin:0 auto; padding:0 24px; height:58px; display:flex; align-items:center; gap:24px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:620; letter-spacing:-0.01em; font-size:15px; }
  .brand .mark { width:22px; height:22px; border-radius:999px; background:var(--ink); -webkit-mask:radial-gradient(circle at 50% 50%, transparent 39%, #000 40%); mask:radial-gradient(circle at 50% 50%, transparent 39%, #000 40%); }
  .brand .sub { color:var(--ink-3); font-weight:500; }
  nav.links { display:flex; gap:20px; font-size:14px; color:var(--ink-2); }
  nav.links a.active { color:var(--ink); font-weight:550; }
  .nav-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .searchbox { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; color:var(--ink-3); font-size:13.5px; width:200px; cursor:text; }
  .searchbox .k { margin-left:auto; font-size:11px; border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--fill); }
  .askai { display:inline-flex; align-items:center; gap:7px; border:1px solid #cfcfd4; border-radius:8px; padding:7px 12px; font-size:13.5px; font-weight:540; color:var(--ink); background:var(--bg); cursor:pointer; }
  .askai:hover { border-color:var(--ink); }

  main.report { max-width:760px; margin:0 auto; padding:48px 24px 110px; }
  .report h1 { font-size:32px; letter-spacing:-0.025em; margin:0 0 10px; font-weight:680; }
  .report .subtitle { font-size:16px; color:var(--ink-3); margin:0 0 34px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:640px){ .form-row{ grid-template-columns:1fr; } }
  .field { margin-bottom:22px; }
  .field > label { display:block; font-size:14px; font-weight:600; margin-bottom:8px; color:var(--ink); }
  .field label .opt { color:var(--ink-3); font-weight:400; }
  .inp { width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 13px; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); outline:none; }
  .inp:hover { border-color:#d3d3d8; }
  .inp:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(0,0,0,0.04); }
  select.inp { appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round'><path d='m4 6 4 4 4-4'/></svg>"); background-repeat:no-repeat; background-position:right 13px center; padding-right:36px; color:var(--ink-3); }
  textarea.inp { min-height:132px; resize:vertical; line-height:1.5; }
  .dropzone { border:1.5px dashed #d6d6da; border-radius:10px; background:var(--fill); padding:32px; text-align:center; color:var(--ink-3); font-size:14px; cursor:pointer; }
  .dropzone:hover { border-color:var(--ink-4); }
  .dropzone .browse { color:var(--ink); font-weight:600; text-decoration:underline; }
  .note { display:flex; gap:10px; border-left:3px solid var(--ink); background:var(--fill); border-radius:0 8px 8px 0; padding:10px 14px; font-size:13.5px; color:var(--ink-2); margin-top:12px; }
  .form-actions { margin-top:28px; display:flex; gap:12px; align-items:center; }
  .btn-primary { background:var(--ink); color:#fff; border:none; border-radius:9px; padding:12px 20px; font:inherit; font-size:14px; font-weight:560; cursor:pointer; }
  .btn-primary:hover { opacity:0.88; }
  .form-note { font-size:12.5px; color:var(--ink-4); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#"><span class="mark"></span> Tamanu <span class="sub">Docs</span></a>
    <nav class="links">
      <a href="#">User manuals</a>
      <a href="#">Release notes</a>
      <a href="#" class="active">Report an issue</a>
    </nav>
    <div class="nav-right">
      <div class="searchbox"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> Search <span class="k">/</span></div>
      <button class="askai"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg> Ask AI</button>
    </div>
  </div>
</header>

<main class="report">
  <h1>Report an issue</h1>
  <p class="subtitle">Tell us what went wrong and we'll look into it. Fields marked optional can be left blank.</p>

  <form onsubmit="return false">
    <div class="form-row">
      <div class="field">
        <label for="r-name">Name</label>
        <input class="inp" id="r-name" type="text" />
      </div>
      <div class="field">
        <label for="r-email">Email</label>
        <input class="inp" id="r-email" type="email" />
      </div>
    </div>

    <div class="field">
      <label for="r-deployment">Country or deployment</label>
      <select class="inp" id="r-deployment">
        <option value="" selected>Select...</option>
        <option>Fiji</option>
        <option>Samoa</option>
        <option>Tonga</option>
        <option>Vanuatu</option>
        <option>Kiribati</option>
        <option>Nauru</option>
        <option>Solomon Islands</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label for="r-desc">Describe the issue</label>
      <textarea class="inp" id="r-desc" placeholder="What happened, and what did you expect to happen?"></textarea>
    </div>

    <div class="field">
      <label>Screenshots <span class="opt">(optional)</span></label>
      <div class="dropzone">Drop files here or <span class="browse">browse</span></div>
      <div class="note">Obscure patient details before attaching.</div>
    </div>

    <div class="form-actions">
      <button class="btn-primary" type="submit">Submit report</button>
      <span class="form-note">We may follow up by email.</span>
    </div>
  </form>
</main>

</body>
</html>
