<!-- spec: patient-portal/patient-details.md -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patient portal patient details editing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; color: #444; background: #d9dde2; }
  .frames { display: flex; gap: 40px; padding: 40px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .frame-wrap { width: 410px; }
  .frame-label { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; font-weight: 500; }
  .phone { width: 410px; background: #f3f5f7; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.12); position: relative; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid #dedede; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 700; color: #326699; }
  .logo-mark { width: 28px; height: 28px; border-radius: 50%; background: #ffcc24; position: relative; }
  .logo-mark::after { content: '+'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #326699; font-weight: 700; }
  .user-btn svg { width: 28px; height: 28px; stroke: #326699; fill: none; stroke-width: 1.8; }

  .content { padding: 10px; }
  h1 { font-size: 26px; font-weight: 500; margin: 8px 6px 16px; color: #444; }
  .stack > * + * { margin-top: 12px; }

  /* Cards and accordions */
  .card { background: #fff; border: 1px solid #dedede; border-radius: 3px; }
  .card-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px; }
  .card-head .t { font-size: 16px; }
  .card-body { padding: 0 16px 16px; }
  .ic { width: 24px; height: 24px; flex: none; stroke: #1172D1; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.red { stroke: #f44336; }
  .acc-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; min-height: 52px; }
  .acc-head .l { display: flex; align-items: center; gap: 8px; }
  .acc-head h4 { margin: 0; font-size: 16px; font-weight: 600; }
  .chev { width: 20px; height: 20px; stroke: #666; fill: none; stroke-width: 2; }
  .acc-body { padding: 4px 16px 16px; }

  .inner { border: 1px solid #dedede; border-radius: 3px; padding: 16px; }
  .inner + .inner { margin-top: 12px; }
  .grey { background: #f9fafb; border-radius: 3px; padding: 14px 16px; }
  .grey + .grey { margin-top: 16px; }
  .chip { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 16px; }
  .chip.red { background: #FFF0EE; color: #F76853; }
  .chip.green { background: #E9F5EE; color: #19934E; }
  .chip.blue { background: #E8F1FB; color: #1172D1; }
  .chip.purple { background: #ECE6FA; color: #4101C9; }
  .chip.orange { background: #FAF0E6; color: #CB6100; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .b { font-weight: 600; font-size: 15px; }
  .sub { color: #666; font-size: 13px; }
  .h5 { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
  .h5 + .inner { margin-top: 0; }
  .sp { height: 16px; }

  .lv { display: grid; grid-template-columns: max-content 1fr; column-gap: 20px; row-gap: 6px; margin: 0; }
  .lv dt { color: #666; margin: 0; }
  .lv dd { margin: 0; font-weight: 500; color: #444; }

  /* Patient details additions */
  .pd-edit-row { display: flex; justify-content: flex-end; margin: -4px 0 6px; }
  .text-btn { background: none; border: 0; color: #326699; font: inherit; font-weight: 500; padding: 4px 6px; border-radius: 3px; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .text-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .group + .group { margin-top: 18px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .field label .req { color: #f76853; margin-left: 2px; }
  .input { width: 100%; border: 1px solid #dedede; border-radius: 3px; padding: 11px 10px; font: inherit; color: #444; background: #fff; min-height: 46px; }
  .input.select { display: flex; justify-content: space-between; align-items: center; }
  .input.select svg { width: 18px; height: 18px; stroke: #666; fill: none; stroke-width: 2; }
  .input.error { border-color: #f76853; }
  .input.focus { border-color: #326699; box-shadow: 0 0 0 1px #326699; }
  .helper { font-size: 12px; color: #f76853; margin-top: 3px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn { font: inherit; font-weight: 500; border-radius: 3px; padding: 8px 20px; cursor: pointer; }
  .btn.outlined { background: #fff; color: #326699; border: 1px solid #326699; }
  .btn.contained { background: #326699; color: #fff; border: 1px solid #326699; }

  .snackbar { position: absolute; left: 16px; right: 16px; background: #323232; color: #fff; border-radius: 4px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .snackbar svg { width: 18px; height: 18px; stroke: #47ca80; fill: none; stroke-width: 2.5; }

  .footer { display: flex; justify-content: center; padding: 28px 0 32px; }
  .crest { width: 44px; height: 52px; border-radius: 6px 6px 22px 22px; background: #e9e4d6; border: 2px solid #b8a06a; }
</style>
</head>
<body>
<div class="frames" id="frames"></div>

<script>
const icon = {
  clock: '<svg class="ic red" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  user: '<svg class="ic" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  steth: '<svg class="ic" viewBox="0 0 24 24"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 12 0V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 12 0v-4"/><circle cx="20" cy="10" r="2"/></svg>',
  ban: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
  heart: '<svg class="ic" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/><path d="M3.2 12.3h4.3l2-3 3 6 2-3h6.3"/></svg>',
  pill: '<svg class="ic" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.9 4.9 0 1 0-7-7l-10 10a4.9 4.9 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>',
  syringe: '<svg class="ic" viewBox="0 0 24 24"><path d="m18 2 4 4M17 7l3-3M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5M9 11l4 4M5 19l-3 3M14 4l6 6"/></svg>',
  up: '<svg class="chev" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>',
  right: '<svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
};

const lv = rows => `<dl class="lv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const acc = (ic, title, body) => `
  <div class="card">
    <div class="acc-head"><div class="l">${ic}<h4>${title}</h4></div>${icon.up}</div>
    <div class="acc-body">${body}</div>
  </div>`;

const appt = date => `<div class="grey">${lv([
  ['Date &amp; time', `${date} 08:00am`], ['Facility', 'Etta Clinic'], ['Area', 'AGCFJ - Adult General Clinic'],
  ['Clinician', 'Fred Holmes'], ['Appt type', 'Standard'],
])}</div>`;

const procedure = (chip, cls) => `<div class="inner">
  <div class="b">Ablation, open, of 1 or more liver tumor(s); cryosurgical</div>
  <div class="row"><div class="sub">22/10/24<br>Dr Bethany Peters</div><span class="chip ${cls}">${chip}</span></div>
</div>`;

const vaccine = (name, chip, cls) => `<div class="inner"><div class="b">${name}</div>
  <div class="row" style="margin-top:6px"><span class="sub">Dose 1 &bull; Week of 12/02/25</span><span class="chip ${cls}">${chip}</span></div></div>`;
const recorded = (dose, date) => `<div class="inner"><div class="b">COVID-19 Pfizer</div>
  <div class="sub" style="margin-top:4px">${dose} &bull; ${date}<br>Given by: Admin<br>Facility/Country: National Fiji Hospital</div></div>`;

/* Patient details: view */
const pdView = values => `
  <div class="pd-edit-row"><button class="text-btn">${icon.pencil}Edit</button></div>
  <div class="group">${lv([
    ['Patient ID', '673HGBJ3'], ['Title', values.title], ['First name', 'Jessie'], ['Middle name', '-'],
    ['Last name', 'Jacobs'], ['Date of birth', '01/01/1980'], ['Sex', 'F'], ['Village', '-'], ['Ethnicity', 'Fijian'],
  ])}</div>
  <div class="group"><p class="h5">Contact</p>${lv([
    ['Mobile phone', values.mobile], ['Other phone', '-'], ['Email', values.email],
  ])}</div>
  <div class="group"><p class="h5">Address</p>${lv([
    ['Street address', values.street], ['Town or city', 'Suva'],
  ])}</div>
  <div class="group"><p class="h5">Emergency contact</p>${lv([
    ['Name', 'Tom Jacobs'], ['Phone', '+679 884 1122'],
  ])}</div>
  <div class="group"><p class="h5">Insurance</p>${lv([
    ['Health insurer', 'Fiji Care Insurance'], ['Policy number', 'FCI-0049231'],
  ])}</div>
  <div class="group"><p class="h5">Other</p>${lv([['Occupation', 'Teacher']])}</div>`;

/* Patient details: edit */
const input = (label, value, opts = {}) => `<div class="field">
  <label>${label}${opts.req ? '<span class="req">*</span>' : ''}</label>
  ${opts.select
    ? `<div class="input select">${value}${icon.down}</div>`
    : `<input class="input${opts.error ? ' error' : ''}${opts.focus ? ' focus' : ''}" value="${value}">`}
  ${opts.error ? `<div class="helper">${opts.error}</div>` : ''}
</div>`;

const pdEdit = `
  <div class="group">${lv([
    ['Patient ID', '673HGBJ3'], ['First name', 'Jessie'], ['Middle name', '-'], ['Last name', 'Jacobs'],
    ['Date of birth', '01/01/1980'], ['Sex', 'F'], ['Village', '-'],
  ])}</div>
  <div class="group"><div class="two">
    ${input('Title', 'Ms', { select: true })}${input('Ethnicity', 'Fijian', { select: true })}
  </div></div>
  <div class="group"><p class="h5">Contact</p>
    ${input('Mobile phone', '+679 771 2345', { req: true })}
    ${input('Other phone', '')}
    ${input('Email', 'jessie.jacobs@example', { error: 'Enter a valid email address' })}
  </div>
  <div class="group"><p class="h5">Address</p>
    ${input('Street address', '45 Waimanu Road', { focus: true })}
    ${input('Town or city', 'Suva')}
  </div>
  <div class="group"><p class="h5">Emergency contact</p>
    ${input('Name', 'Tom Jacobs')}${input('Phone', '+679 884 1122')}
  </div>
  <div class="group"><p class="h5">Insurance</p>
    ${input('Health insurer', 'Fiji Care Insurance', { select: true })}${input('Policy number', 'FCI-0049231')}
  </div>
  <div class="group"><p class="h5">Other</p>${input('Occupation', 'Teacher', { select: true })}</div>
  <div class="actions"><button class="btn outlined">Cancel</button><button class="btn contained">Save</button></div>`;

const before = { title: 'Ms', mobile: '+679 771 2345', email: 'jessie.jacobs@example.com', street: '12 Victoria Parade' };
const after = { ...before, street: '45 Waimanu Road' };

const page = (patientDetailsBody, snackbarTop) => `
  <div class="phone">
    <div class="header">
      <div class="logo"><span class="logo-mark"></span>tamanu</div>
      <span class="user-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.7v-1.7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.7"/></svg></span>
    </div>
    <div class="content">
      <h1>Hi Jessie Jacobs 👋</h1>
      <div class="stack">
        <div class="card">
          <div class="card-head">${icon.clock}<div class="t">You have 1 outstanding form to complete below</div></div>
          <div class="card-body"><div class="inner row">
            <div><div class="b" style="font-size:14px">General pre-admission patient form</div>
            <span class="chip red" style="margin-top:8px">To be completed</span></div>${icon.right}
          </div></div>
        </div>
        <div class="card">
          <div class="card-head">${icon.cal}<div class="t">You have 2 upcoming appointments</div></div>
          <div class="card-body">${appt('07/04/22')}${appt('10/04/22')}</div>
        </div>
        ${acc(icon.user, 'Patient details', patientDetailsBody)}
        ${acc(icon.steth, 'Ongoing conditions', '<div style="font-weight:500">Basal ganglia haemorrhage<br>Diabetes</div>')}
        ${acc(icon.ban, 'Allergies', '<div style="font-weight:500">Penicillin (rash)<br>Aspirin (anaphylaxis)</div>')}
        ${acc(icon.heart, 'Procedures', `<p class="h5">Planned procedures</p>${procedure('Planned', 'green')}
          <div class="sp"></div><p class="h5">Completed procedures</p>${procedure('Completed', 'blue')}${procedure('Completed', 'blue')}`)}
        ${acc(icon.pill, 'Medications', `<div class="grey">${lv([
          ['Medication', 'Abacavir 300mg tablet'], ['Dose', '1 tab'], ['Frequency', 'Twice daily'],
          ['Route', 'Oral'], ['Date', '08/12/24'], ['Prescriber', 'Bethany Peters'],
        ])}</div>`)}
        ${acc(icon.syringe, 'Vaccinations', `<p class="h5">Vaccine schedule</p>
          ${vaccine('BCG', 'Scheduled', 'purple')}${vaccine('HPV', 'Upcoming', 'blue')}
          ${vaccine('Hep B', 'Due', 'green')}${vaccine('Hep C', 'Overdue', 'orange')}
          <div class="sp"></div><p class="h5">Recorded vaccines</p>
          ${recorded('Dose 1', '08/09/21')}${recorded('Dose 2', '10/10/21')}`)}
      </div>
    </div>
    <div class="footer"><div class="crest"></div></div>
    ${snackbarTop ? `<div class="snackbar" style="top:${snackbarTop}px">${icon.check}Details saved</div>` : ''}
  </div>`;

const frames = [
  ['1. View', page(pdView(before))],
  ['2. Edit', page(pdEdit)],
  ['3. Saved', page(pdView(after), 1570)],
];

document.getElementById('frames').innerHTML = frames
  .map(([label, html]) => `<div class="frame-wrap"><p class="frame-label">${label}</p>${html}</div>`)
  .join('');
</script>
</body>
</html>
